<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบประเมินบุคลากร</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #1d4e89; }
    body { font-family: 'Sarabun', sans-serif; background: #f4f6fa; }
    .sidebar { width: 240px; min-height: 100vh; background: var(--brand); }
    .sidebar .nav-link { color: #cfe0f5; border-radius: .5rem; }
    .sidebar .nav-link.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }
    .brand { color: #fff; font-weight: 700; font-size: 1.1rem; }
    .card { border: 0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat { font-size: 1.8rem; font-weight: 700; }
    .progress { height: .5rem; }
    .table td, .table th { vertical-align: middle; }
    @media (max-width: 991px) { .sidebar { display: none !important; } }
  </style>
</head>
<body>
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card p-4" style="max-width:420px;width:100%">
    <div class="text-center mb-3">
      <i class="bi bi-clipboard2-check text-primary" style="font-size:3rem"></i>
      <h4 class="fw-bold mb-0">ระบบประเมินบุคลากร</h4>
      <div class="text-secondary small">วิทยาลัยเทคนิคตัวอย่าง</div>
    </div>
    <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle"></i> อีเมลหรือรหัสผ่านไม่ถูกต้อง (ตัวอย่างเมื่อ API ตอบ 401)</div>
    <form>
      <label class="form-label">อีเมล</label>
      <input type="email" class="form-control mb-3" placeholder="name@college.ac.th" required>
      <label class="form-label">รหัสผ่าน</label>
      <input type="password" class="form-control mb-3" required minlength="4">
      <button class="btn btn-primary w-100">เข้าสู่ระบบ</button>
    </form>
    <div class="text-center mt-3 small">ผู้รับการประเมินที่ยังไม่มีบัญชี <a href="#">ลงทะเบียน</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
